name: APK Android (Agenda RT)

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # El runner de GitHub ya trae el SDK de Android con las licencias aceptadas;
      # solo se asegura la plataforma y las build-tools que pide el proyecto.
      - name: Preparar SDK de Android
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      # La llave de firma llega como secreto del repositorio y se escribe fuera
      # del árbol del proyecto, para que no pueda colarse en el APK ni en git.
      # Si el secreto no está configurado, se compila con la llave de depuración
      # de siempre y se avisa: ese APK no se podrá instalar encima de otro.
      - name: Preparar la llave de firma
        id: llave
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::Sin secreto ANDROID_KEYSTORE_B64: el APK irá firmado con una llave de depuración distinta en cada compilación y NO se podrá instalar encima de una instalación anterior."
            echo "firmado=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/agenda.jks"
          chmod 600 "$RUNNER_TEMP/agenda.jks"
          echo "firmado=si" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        working-directory: android
        env:
          ANDROID_KEYSTORE: ${{ steps.llave.outputs.firmado == 'si' && format('{0}/agenda.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      # La llave se borra siempre, aunque la compilación falle.
      - name: Borrar la llave
        if: always()
        run: rm -f "$RUNNER_TEMP/agenda.jks"

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: agenda-rt-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
