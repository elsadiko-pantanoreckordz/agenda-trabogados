name: APK Android (Agenda RT)

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # El runner de GitHub ya trae el SDK de Android con las licencias aceptadas;
      # solo se asegura la plataforma y las build-tools que pide el proyecto.
      - name: Preparar SDK de Android
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK de depuración
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: agenda-rt-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
